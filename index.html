<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oppa Cafe | منيو أوبا كافيه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --stone-bg: #f5f3ef;
      --stone-soft: #ece8e1;
      --white: #ffffff;
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --teal-light: #e6f7f5;
      --teal-border: #bce6e2;
      --whatsapp: #16a34a;
      --whatsapp-hover: #15803d;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e5e0d8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--stone-bg);
      color: var(--text);
      padding-bottom: 118px;
      line-height: 1.65;
      min-height: 100vh;
    }

    .topbar {
      background-color: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .topbar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-inner::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background-color: var(--stone-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--teal);
      color: var(--white);
      border-color: var(--teal);
    }

    .page {
      display: none;
      max-width: 780px;
      margin: 0 auto;
      padding: 18px 14px;
      animation: fadeIn 0.22s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* صفحة الغلاف */
    .cover-card {
      background: linear-gradient(165deg, var(--white) 0%, var(--stone-soft) 100%);
      border: 1.5px solid var(--teal-border);
      border-radius: 26px;
      padding: 34px 20px 28px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.08);
    }

    .cover-logo-frame {
      width: 118px;
      height: 118px;
      margin: 0 auto 16px;
      border-radius: 28px;
      background-color: #090d16;
      border: 4px solid var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(13, 148, 136, 0.22);
    }

    .cover-logo-frame svg {
      width: 98px;
      height: 98px;
    }

    .cover-badge {
      display: inline-block;
      background-color: var(--teal-light);
      color: var(--teal-dark);
      border: 1px solid var(--teal-border);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .cover-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--teal-dark);
      margin-bottom: 4px;
    }

    .cover-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .cover-card p {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 480px;
      margin: 0 auto 22px;
    }

    .start-btn {
      background: linear-gradient(135deg, var(--teal-dark), var(--teal));
      color: var(--white);
      border: none;
      border-radius: 14px;
      padding: 13px 28px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(13, 148, 136, 0.25);
      margin-bottom: 24px;
    }

    .sections-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      text-align: right;
    }

    @media (max-width: 480px) {
      .sections-grid {
        grid-template-columns: 1fr;
      }
    }

    .cover-section-tile {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .cover-section-tile:hover {
      border-color: var(--teal);
      transform: translateY(-1px);
    }

    .cover-section-tile strong {
      font-size: 0.92rem;
      color: var(--text);
      display: block;
    }

    .cover-section-tile span {
      font-size: 0.78rem;
      color: var(--teal-dark);
      font-weight: 700;
    }

    /* رأس صفحة القسم */
    .section-hero {
      background-color: var(--white);
      border: 1.5px solid var(--teal-border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.06);
    }

    .section-artwork {
      background: linear-gradient(120deg, var(--teal-light) 0%, var(--stone-soft) 100%);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--teal-border);
    }

    .section-artwork .title-group h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--teal-dark);
    }

    .section-artwork .title-group p {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .section-photo-box {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      background-color: var(--white);
      border: 1.5px solid var(--teal-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.1);
    }

    .section-photo-box svg {
      width: 62px;
      height: 62px;
    }

    .menu-item {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .item-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .item-price {
      display: inline-block;
      background-color: var(--teal-light);
      color: var(--teal-dark);
      border: 1px solid var(--teal-border);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 2px 10px;
      border-radius: 9px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--teal-border);
      background-color: var(--stone-bg);
      color: var(--teal-dark);
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-btn.add {
      background-color: var(--teal);
      color: var(--white);
      border-color: var(--teal);
    }

    .qty-val {
      min-width: 22px;
      text-align: center;
      font-weight: 800;
    }

    .page-pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }

    .pager-btn {
      flex: 1;
      background-color: var(--white);
      color: var(--teal-dark);
      border: 1.5px solid var(--teal-border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .pager-btn.primary {
      background-color: var(--teal);
      color: var(--white);
      border-color: var(--teal);
    }

    .note-box {
      background-color: var(--white);
      border: 1.5px solid var(--teal-border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 14px;
    }

    .note-box label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--teal-dark);
      margin-bottom: 6px;
    }

    .note-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--stone-bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .note-box input:focus {
      border-color: var(--teal);
      background-color: var(--white);
    }

    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--white);
      border-top: 1.5px solid var(--teal-border);
      padding: 12px 16px;
      z-index: 50;
      box-shadow: 0 -6px 20px rgba(15, 23, 42, 0.08);
    }

    .cart-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .cart-summary {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .cart-summary strong {
      font-size: 1.05rem;
      color: var(--teal-dark);
      display: block;
    }

    .whatsapp-btn {
      background-color: var(--whatsapp);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .whatsapp-btn:hover {
      background-color: var(--whatsapp-hover);
    }

    .whatsapp-btn:disabled {
      background-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>

    const cart = {};
    let currentPageId = "cover";

    function openPage(pageId) {
      currentPageId = pageId;
      document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
      const target = document.getElementById(pageId === "cover" ? "page-cover" : `page-${pageId}`);
      if (target) target.classList.add("active");

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.page === pageId);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderTopbarTabs() {
      const topbar = document.getElementById("topbar-tabs");
      const tabs = [{ id: "cover", label: "الغلاف" }, ...MENU_DATA.map((s) => ({ id: s.id, label: s.category }))];
      topbar.innerHTML = tabs
        .map(
          (t) => `<button class="tab-btn ${currentPageId === t.id ? "active" : ""}" data-page="${t.id}" onclick="openPage('${t.id}')">${t.label}</button>`
        )
        .join("");
    }

    function renderCoverGrid() {
      const grid = document.getElementById("cover-sections");
      grid.innerHTML = MENU_DATA.map(
        (sec) => `
          <div class="cover-section-tile" onclick="openPage('${sec.id}')">
            <div>
              <strong>${sec.category}</strong>
              <span>${sec.items.length} أصناف</span>
            </div>
            <span>←</span>
          </div>
        `
      ).join("");
    }

    function renderSectionPages() {
      const container = document.getElementById("section-pages-container");
      container.innerHTML = "";

      MENU_DATA.forEach((section, index) => {
        const page = document.createElement("section");
        page.className = `page ${currentPageId === section.id ? "active" : ""}`;
        page.id = `page-${section.id}`;

        const hero = document.createElement("div");
        hero.className = "section-hero";
        hero.innerHTML = `
          <div class="section-artwork">
            <div class="title-group">
              <h2>${section.category}</h2>
              <p>${section.subtitle}</p>
            </div>
            <div class="section-photo-box">${SECTION_ART[section.id] || ""}</div>
          </div>
        `;
        page.appendChild(hero);

        section.items.forEach((item) => {
          const qty = cart[item.id] || 0;
          const row = document.createElement("div");
          row.className = "menu-item";
          row.innerHTML = `
            <div>
              <div class="item-name">${item.name}</div>
              <span class="item-price">${item.price} ر.س</span>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
              <span class="qty-val">${qty}</span>
              <button class="qty-btn add" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          `;
          page.appendChild(row);
        });

        const note = document.createElement("div");
        note.className = "note-box";
        note.innerHTML = `
          <label for="note-${section.id}">ملاحظات على الطلب (اختياري)</label>
          <input id="note-${section.id}" type="text" placeholder="مثال: بدون سكر، ثلج زيادة، رقم الطاولة..." oninput="syncNotes(this.value)" />
        `;
        page.appendChild(note);

        const prevPage = index === 0 ? "cover" : MENU_DATA[index - 1].id;
        const nextPage = index < MENU_DATA.length - 1 ? MENU_DATA[index + 1].id : "cover";
        const nextLabel = index < MENU_DATA.length - 1 ? MENU_DATA[index + 1].category : "العودة للغلاف";

        const pager = document.createElement("div");
        pager.className = "page-pager";
        pager.innerHTML = `
          <button class="pager-btn" onclick="openPage('${prevPage}')">→ السابق</button>
          <button class="pager-btn primary" onclick="openPage('${nextPage}')">${nextLabel} ←</button>
        `;
        page.appendChild(pager);

        container.appendChild(page);
      });

      updateCartBar();
    }

    function syncNotes(val) {
      document.querySelectorAll(".note-box input").forEach((inp) => {
        if (inp.value !== val) inp.value = val;
      });
    }

    function findItemById(id) {
      for (const sec of MENU_DATA) {
        const found = sec.items.find((i) => i.id === id);
        if (found) return found;
      }
      return null;
    }

    function changeQty(id, delta) {
      const noteInp = document.querySelector(".note-box input");
      const savedNote = noteInp ? noteInp.value : "";

      const current = cart[id] || 0;
      const next = Math.max(0, current + delta);
      if (next === 0) {
        delete cart[id];
      } else {
        cart[id] = next;
      }

      renderSectionPages();
      if (savedNote) syncNotes(savedNote);
    }

    function updateCartBar() {
      let totalItems = 0;
      let totalPrice = 0;

      Object.entries(cart).forEach(([id, qty]) => {
        const item = findItemById(Number(id));
        if (item) {
          totalItems += qty;
          totalPrice += item.price * qty;
        }
      });

      document.getElementById("cart-count").textContent = `${totalItems} أصناف مختارة`;
      document.getElementById("cart-total").textContent = `الإجمالي: ${totalPrice} ر.س`;
      document.getElementById("order-btn").disabled = totalItems === 0;
    }

    function sendOrder() {
      const noteInp = document.querySelector(".note-box input");
      const note = noteInp ? noteInp.value.trim() : "";

      let lines = ["مرحباً Oppa Cafe، أود طلب:", ""];
      let totalPrice = 0;

      Object.entries(cart).forEach(([id, qty]) => {
        const item = findItemById(Number(id));
        if (item) {
          const sub = item.price * qty;
          totalPrice += sub;
          lines.push(`• ${item.name} × ${qty} = ${sub} ر.س`);
        }
      });

      lines.push("", `الإجمالي: ${totalPrice} ر.س`);
      if (note) {
        lines.push(`ملاحظات: ${note}`);
      }

      const text = encodeURIComponent(lines.join("\n"));
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
    }

    renderTopbarTabs();
    renderCoverGrid();
    renderSectionPages();
  </script>
